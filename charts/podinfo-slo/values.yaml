replicaCount: 3

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: "6.17.0"

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi

slo:
  # Availability: share of requests that do not return 5xx over 30 days.
  availabilityTarget: 0.995
  # Latency: share of requests served faster than the threshold.
  latencyTarget: 0.99
  latencyThresholdSeconds: "0.25"   # must match a histogram bucket
  runbookBaseUrl: https://github.com/abdoelwaly/eks-helm-observability/blob/main/docs/runbooks.md
